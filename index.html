<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBLUE — bản mẫu giao diện</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design/tokens.css">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;
     font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:21px;
     color:var(--text);background:var(--hover);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-s)}
h1,.brand,.tab,.dev,.badge,.note b,.open{font-family:'Be Vietnam Pro',Inter,system-ui,sans-serif}

/* ── topbar 56 ── */
.top{height:var(--topbar);flex:none;display:flex;align-items:center;gap:20px;
     padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border-light)}
.brand{font-weight:700;font-size:16px;letter-spacing:-.2px;color:var(--ink)}
.brand span{font-weight:500;color:var(--text-3);margin-left:8px;font-size:13px}
.badge{margin-left:2px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);
       background:var(--field);color:var(--text-2)}

.tabs{display:flex;gap:2px;margin-left:8px}
.tab{padding:6px 14px;border-radius:var(--r-pill);font-size:13px;font-weight:500;
     color:var(--text-2);transition:background var(--t-mid),color var(--t-mid)}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--primary-selected);color:var(--primary);font-weight:600}

.right{margin-left:auto;display:flex;align-items:center;gap:10px}
.devs{display:flex;background:var(--field);border-radius:var(--r-m);padding:2px}
.dev{padding:5px 12px;border-radius:var(--r-s);font-size:12px;font-weight:500;color:var(--text-2)}
.dev.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--sh-s)}
.dev[disabled]{opacity:.4;cursor:default}
.open{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--primary);
      padding:6px 12px;border-radius:var(--r-m);border:1px solid var(--border)}
.open:hover{background:var(--hover)}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;
     stroke-linecap:round;stroke-linejoin:round}

/* ── dòng "vì sao" ── */
.note{flex:none;padding:10px 20px;background:var(--surface);
      border-bottom:1px solid var(--border-light);font-size:13px;line-height:19px;color:var(--text-2)}
.note b{color:var(--text);font-weight:600}
.note i{font-style:normal;color:var(--text-3)}

/* ── sân khấu ── */
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:20px;overflow:auto}
.frame{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);
       overflow:hidden;box-shadow:var(--sh-s);width:100%;max-width:100%;
       transition:max-width var(--t-slow)}
.stage.phone .frame{max-width:375px;border-radius:var(--r-art)}
iframe{display:block;width:100%;height:100%;border:none}

.fallback{display:none;padding:28px;text-align:center;color:var(--text-2);font-size:13px}
.fallback code{background:var(--field);padding:2px 6px;border-radius:var(--r-s);
               font-size:12px;color:var(--text)}

@media(max-width:767px){
  .top{gap:10px;padding:0 12px;overflow-x:auto}
  .tabs{margin-left:0}.tab{padding:6px 10px}
  .devs,.open span{display:none}
  .note{padding:9px 12px}
  .stage{padding:0}
  .frame{border:none;border-radius:0}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">OBLUE<span>bản mẫu đã duyệt</span></div>
  <nav class="tabs" id="tabs" aria-label="Chọn bản mẫu"></nav>
  <div class="right">
    <div class="devs" role="group" aria-label="Bề ngang khung xem">
      <button class="dev on" data-w="wide">Máy tính</button>
      <button class="dev" data-w="phone">Điện thoại 375</button>
    </div>
    <a class="open" id="open" href="#" target="_blank" rel="noopener">
      <svg class="ico" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      <span>Mở riêng</span>
    </a>
  </div>
</header>

<div class="note" id="note"></div>

<main class="stage" id="stage">
  <div class="frame">
    <iframe id="view" title="Bản mẫu giao diện OBLUE"></iframe>
    <div class="fallback" id="fallback">
      Trình duyệt đang chặn nhúng file cục bộ.
      Chạy <code>python3 -m http.server</code> ở thư mục gốc rồi mở
      <code>http://localhost:8000</code>, hoặc bấm <b>Mở riêng</b> ở trên.
    </div>
  </div>
</main>

<script>
const DEMOS = [
  { id:'teacher',
    file:'design/_reference/oblue-platform-demo.html',
    label:'Giáo viên & trợ giảng',
    note:'<b>11 màn</b> — Tổng quan · Chấm bài · Học viên · Lớp học · Trang lớp (5 tab) · Lộ trình · Ngân hàng đề · Học phí · Bảng tin · Cấu hình · Việc của trợ giảng. <i>Rail 104 + panel 260 (danh sách lớp = bộ lọc chung) + canvas 1180.</i>',
    phone:false },
  { id:'student',
    file:'design/_reference/oblue-student-demo.html',
    label:'Học viên',
    note:'<b>7 màn</b> — Hôm nay · Làm bài · Đã nộp · Nhận xét · Tiến độ · Luyện · Bài luyện 5 phút. <i>Tab đáy 60px; mọi màn phải dùng được ở 375px — bấm "Điện thoại 375" để xem đúng bề ngang.</i>',
    phone:true },
  { id:'auth',
    file:'design/_reference/oblue-auth-demo.html',
    label:'Đăng nhập & lời mời',
    note:'<b>10 bước</b> — một ô SĐT, không chọn vai; vai tra từ memberships. Cô vào bằng email, em vào bằng SĐT. <i>Gồm cả nhánh từ chối: SĐT lệch số cô đã lưu, và SĐT chưa ở lớp nào.</i>',
    phone:false }
];

const tabs = document.getElementById('tabs');
const view = document.getElementById('view');
const note = document.getElementById('note');
const stage = document.getElementById('stage');
const open  = document.getElementById('open');
const fallback = document.getElementById('fallback');
let current = DEMOS[0], width = 'wide';

DEMOS.forEach(d => {
  const b = document.createElement('button');
  b.className = 'tab'; b.textContent = d.label; b.dataset.id = d.id;
  b.onclick = () => show(d.id);
  tabs.appendChild(b);
});

function show(id){
  current = DEMOS.find(d => d.id === id) || DEMOS[0];
  watchLoad();
  view.src = current.file;
  note.innerHTML = current.note;
  open.href = current.file;
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('on', b.dataset.id === current.id));
  setWidth(current.phone ? 'phone' : 'wide');
  location.hash = current.id;
}

function setWidth(w){
  width = w;
  stage.classList.toggle('phone', w === 'phone');
  document.querySelectorAll('.dev').forEach(b =>
    b.classList.toggle('on', b.dataset.w === w));
}

document.querySelectorAll('.dev').forEach(b => b.onclick = () => setWidth(b.dataset.w));

// file:// ở vài trình duyệt chặn nhúng — chỉ hiện lối thoát khi iframe thật sự không tải được.
// Không dò bằng contentDocument: mở bằng file:// thì Chrome chặn đọc chéo origin dù khung vẫn hiện.
let loaded = false, timer = null;
view.addEventListener('load', () => {
  loaded = true;
  fallback.style.display = 'none';
  view.style.display = 'block';
});
function watchLoad(){
  loaded = false;
  fallback.style.display = 'none';
  view.style.display = 'block';
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (loaded) return;
    view.style.display = 'none';
    fallback.style.display = 'block';
  }, 3000);
}

show((location.hash || '').slice(1) || DEMOS[0].id);
</script>
</body>
</html>
